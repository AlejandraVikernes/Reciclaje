<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado del Compromiso | Eco-Venados</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <aside>
        <div class="logo-container">
            <div class="logo-wrapper">
                <svg class="logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <path d="M100 175 L100 105" stroke="#111111" stroke-width="11" stroke-linecap="round"/>
                    <path d="M100 175 L100 105" stroke="#4ade80" stroke-width="7" stroke-linecap="round"/>
                    <path d="M100 140 Q 70 120 60 135" stroke="#111111" stroke-width="7" stroke-linecap="round" fill="none"/>
                    <path d="M100 140 Q 130 120 140 135" stroke="#111111" stroke-width="7" stroke-linecap="round" fill="none"/>
                    <line x1="93" y1="175" x2="91" y2="195" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
                    <line x1="107" y1="175" x2="109" y2="195" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
                    <path d="M98 115 C 30 110, 5 35, 10 10 C 35 15, 75 60, 98 115 Z" fill="#22c55e" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>
                    <path d="M55 75 L30 50 M65 85 L45 70" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
                    <path d="M102 115 C 170 110, 195 35, 190 10 C 165 15, 125 60, 102 115 Z" fill="#4ade80" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>
                    <path d="M145 75 L170 50 M135 85 L155 70" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
                    <ellipse cx="84" cy="78" rx="15" ry="18" fill="#ffffff" stroke="#111111" stroke-width="5"/>
                    <circle cx="87" cy="79" r="4" fill="#111111"/>
                    <ellipse cx="116" cy="78" rx="15" ry="18" fill="#ffffff" stroke="#111111" stroke-width="5"/>
                    <circle cx="113" cy="79" r="4" fill="#111111"/>
                    <path d="M90 100 Q 100 114 110 100 Z" fill="#111111" stroke="#111111" stroke-width="2"/>
                </svg>
            </div>
            <h2>Huella Positiva</h2>
        </div>
        <h2 class="menu-title">Menú</h2>
        <ul>
            <li><a href="index.html">Volver al Inicio</a></li>
        </ul>
    </aside>

    <main class="contenedor-form">
        <h1>Gracias por tu Compromiso</h1>
        <p>Los datos enviados desde el formulario se han procesado correctamente:</p>

        <div id="contenido-resultado" class="resultado-box"></div>

        <a href="index.html" class="btn-volver">Regresar a la Página Principal</a>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const contenedor = document.getElementById("contenido-resultado");

        const nombre = params.get("nombre");
        const edad = params.get("edad");
        const grupo = params.get("grupo");
        const residuo = params.get("residuo");
        const separacion = params.get("separacion");
        const accion = params.get("accion");
        const compromisos = params.getAll("compromisos");
        const piezas = Math.max(0, Number(params.get("reto_piezas")) || 0);
        const comentario = params.get("comentario");

        const mensual = piezas * 4;
        const anual = piezas * 52;
        const kgAnuales = (anual * 0.025).toFixed(2);

        if (nombre) {
            let listaCompromisos = "Ninguno";
            if (compromisos.length > 0) {
                listaCompromisos = "<ul>" + compromisos.map(c => `<li>${c}</li>`).join("") + "</ul>";
            }

            contenedor.innerHTML = `
                <p><b>Nombre completo:</b> ${nombre}</p>
                <p><b>Edad:</b> ${edad}</p>
                <p><b>Grupo:</b> ${grupo}</p>
                <p><b>Residuo frecuente:</b> ${residuo}</p>
                <p><b>¿Separa residuos?:</b> ${separacion}</p>
                <p><b>Acciones ambientales:</b> ${accion}</p>
                <p><b>Compromisos seleccionados:</b> ${listaCompromisos}</p>
                <p><b>Comentario o propuesta:</b> ${comentario && comentario.trim() !== "" ? comentario : "Sin comentarios"}</p>
                <hr>
                <p><b>Reto didáctico (envases por semana):</b> ${piezas}</p>
                <p><b>Proyección mensual (4 semanas):</b> ${mensual} envases</p>
                <p><b>Proyección anual (52 semanas):</b> ${anual} envases (${kgAnuales} kg aprox.)</p>
            `;
        } else {
            contenedor.innerHTML = "<p>No se han recibido datos del formulario.</p>";
        }
    </script>

</body>
</html>
