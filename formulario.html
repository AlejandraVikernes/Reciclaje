<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Participantes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 20px;
        }
        h1 {
            color: green;
            text-align: center;
        }
        nav {
            text-align: center;
            margin-bottom: 20px;
        }
        nav a {
            margin: 10px;
            font-weight: bold;
        }
        form {
            background-color: white;
            padding: 20px;
            border: 1px solid #ccc;
            width: 300px;
            margin: 0 auto;
        }
        input {
            margin-bottom: 10px;
            display: block;
            width: 90%;
        }
        .radio-btn {
            display: inline;

        }

<body>

    <h1>Registro de Participantes</h1>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="formulario.html">Registro</a>
    </nav>

    <form action="procesar.php" method="POST">
        <h3>Llena tus datos:</h3>

        <label>Nombre:</label>
        <input type="text" name="nombre" required>

        <label>Correo:</label>
        <input type="email" name="correo" required>

        <label>Número de árboles:</label>
        <input type="number" name="arboles" required>

        <label>Fecha:</label>
        <input type="date" name="fecha" required>

        <label>¿Has plantado antes?</label>
        <input type="radio" name="experiencia" value="Sí" class="radio-btn" required> Sí
        <input type="radio" name="experiencia" value="No" class="radio-btn" required> No

        <br><br>
        <input type="submit" value="Enviar">
    </form>

    <footer>
